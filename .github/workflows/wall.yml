# Redraws docs/wall.svg: every painted commit of the default branch, i.e. the
# collaborative painting shown in the README.
name: Community wall picture

on:
  push:
    paths-ignore: [docs/wall.svg]
  schedule:
    - cron: "17 3 * * 1"   # weekly: the graph scrolls as time goes by
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: community-wall-picture
  cancel-in-progress: false

jobs:
  draw:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 0
      - name: Draw the wall
        run: python3 paint.py wall docs/wall.svg
      - name: Commit the picture
        run: |
          git diff --quiet -- docs/wall.svg && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/wall.svg
          git commit -m "Update the community wall picture"
          for i in 1 2 3; do git pull --rebase --no-tags origin HEAD && git push origin HEAD && exit 0; sleep 5; done
          exit 1
